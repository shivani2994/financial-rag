name: Full RAGAS evaluation (manual)

# Manual only -- never runs on push or pull_request; see
# fast-evaluation-gate.yml for what gates those.
#
# Full RAGAS scoring (faithfulness, answer relevance, context precision)
# runs src/evaluation/harness.py, which uses a local Ollama model as the
# judge. Measured locally on a small 1-2B model: roughly 1.5-2.5 hours for
# all 15 questions, with some judge calls timing out or failing to parse
# regardless -- a known limitation of a small local judge, not a bug (see
# README and Module 7 notes). That is not something to run on every push,
# which is the entire reason the fast, deterministic gate
# (fast-evaluation-gate.yml) exists as a separate mode.
#
# This workflow installs and starts Ollama on the runner itself and pulls
# a small model, so triggering it should genuinely produce real RAGAS
# scores rather than a documentation-only stub -- but it has not been
# exercised end-to-end on GitHub-hosted infrastructure as part of this
# change (only the fast gate was actually run and verified). Treat a first
# real run of this workflow as the first real test of it.

on:
  workflow_dispatch:

jobs:
  full-ragas-evaluation:
    runs-on: ubuntu-latest
    # Generous headroom over the ~2.5h measured locally; GitHub's own
    # default job timeout is 6h (360m), which would also cover this, but
    # setting it explicitly documents the expectation.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Cache Hugging Face model downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-bge-base-en-v1.5-bge-reranker-base

      - name: Install dependencies
        run: uv sync

      - name: Build indexes from committed chunks.jsonl
        run: uv run python -m src.indexing.pipeline

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull llama3.2:1b

      - name: Run full RAGAS evaluation harness
        run: uv run python -m src.evaluation.harness

      - name: Upload evaluation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-evaluation-logs
          path: logs/
